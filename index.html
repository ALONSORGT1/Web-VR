<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Web-VR | Arrastrar cubos con las manos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="css/style.css">

  <!-- three.js 0.187.0 (MIT) incluido en libs/three: funciona sin CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three/build/three.module.js",
      "three/addons/": "./libs/three/examples/jsm/",
      "cannon-es": "./libs/cannon-es/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <strong>Web-VR</strong> &middot; Agarra, apila y lanza los cubos con las manos o los controles<br>
    Pellizca (o aprieta el gatillo) apuntando a un cubo o al menu para agarrarlo.
  </div>
  <div id="error" hidden></div>
  <nav id="desktop-controls" aria-label="Controles de la escena">
    <button id="reset-scene" type="button">Reiniciar cubos</button>
    <button id="exit-vr" type="button" disabled>Salir de VR</button>
  </nav>
  <footer id="credits">
    <span>Desarrollado por <strong>Alonso Ramírez Gutiérrez</strong></span>
    <a href="https://github.com/ALONSORGT1" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://www.linkedin.com/in/alonso-ram%C3%ADrez-guti%C3%A9rrez-27074516b/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
